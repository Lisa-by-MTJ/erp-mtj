<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTJ Channel Manager</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#f3f4f8;--panel:#0e1a45;--panel2:#1b3691;--card:#ffffff;--line:#c9cede;--txt:#101425;--mut:#5d6478;
--hi:#1b3691;--soft:#e3e7f2;--grad:linear-gradient(160deg,#0e1a45 0%,#1b3691 58%,#2f56c4 100%)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,'Segoe UI',sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--grad);color:#e8ecfa;padding:18px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
nav::after{content:'';display:block;position:sticky;top:0;height:0;box-shadow:0 0 40px 8px rgba(27,54,145,.35)}
.logo{padding:12px 18px 16px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:10px;display:flex;align-items:center;gap:11px}
.logo img{width:38px;height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.logo b{font-size:14px;letter-spacing:.04em;color:#fff}.logo small{display:block;color:#aab6e3;font-size:10.5px;margin-top:2px;letter-spacing:.05em}
nav a{display:block;padding:9px 18px;color:#b9c4ea;text-decoration:none;font-size:13px;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.08);color:#fff}
nav a.on{color:#fff;font-weight:700;border-left:3px solid #ff8a2a;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,0))}
main{flex:1;padding:22px 28px;max-width:1250px}
h1{font-size:20px;margin-bottom:4px}
h2{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin:22px 0 10px;
  border-bottom:1px solid var(--line);padding-bottom:5px}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.welcome{background:var(--grad);border-radius:14px;color:#fff;padding:26px 28px;margin:0 0 8px;
  display:flex;align-items:center;gap:22px;box-shadow:0 8px 28px rgba(14,26,69,.35);position:relative;overflow:hidden}
.welcome::after{content:'';position:absolute;right:-60px;top:-90px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(47,86,196,.55),transparent 70%)}
.welcome img{width:74px;height:auto;filter:drop-shadow(0 3px 10px rgba(0,0,0,.4))}
.welcome h1{font-size:22px;margin:0;color:#fff}
.welcome .wsub{color:#c3cdf1;font-size:13px;margin-top:4px}
.welcome .tagline{font-style:italic;color:#ffcf9e;font-size:12px;margin-top:8px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;border-top:3px solid var(--panel2)}
.kpi .lbl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-size:21px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg,#0e1a45,#2f56c4);-webkit-background-clip:text;background-clip:text;color:transparent}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
th{background:linear-gradient(120deg,#eef1f9,#e3e7f2);text-align:left;padding:8px 10px;color:#3c4360;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-top:1px solid var(--line)}
tr:hover td{background:#f0f3fb}
.btn{display:inline-block;background:linear-gradient(135deg,#1b3691,#2f56c4);color:#fff;border:1px solid #1b3691;border-radius:7px;
  padding:7px 13px;font-weight:600;font-size:12px;cursor:pointer;margin:2px 4px 2px 0}
.btn:hover{background:linear-gradient(135deg,#0e1a45,#1b3691)}
.btn.gray{background:var(--soft);color:var(--txt);border-color:var(--line)}
.btn.gray:hover{background:#d5dbeb}
.btn.warn{background:transparent;color:var(--txt);border:1px solid var(--hi)}
.btn.warn:hover{background:var(--soft)}
.btn.sm{padding:4px 9px;font-size:11px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:7px 9px;font-size:13px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--hi);box-shadow:0 0 0 3px rgba(27,54,145,.15)}
form .row{display:flex;gap:10px;margin-bottom:10px}form label{display:block;color:var(--mut);font-size:11px;margin-bottom:3px}
.formbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:600;border:1px solid var(--line)}
.b-POSTED,.b-ACTIVE,.b-PAID,.b-RESERVED{background:linear-gradient(135deg,#1b3691,#2f56c4);color:#fff;border-color:#1b3691}
.b-DRAFT,.b-PLANNED{background:var(--card);color:var(--mut)}
.b-SUBMITTED,.b-IN_PROGRESS,.b-REPAIRING{background:var(--soft);color:var(--txt)}
.b-APPROVED,.b-CONTRACTED,.b-COMPLETED{background:#fff;color:var(--hi);border-color:var(--hi)}
.mut{color:var(--mut)}
#toast{position:fixed;bottom:18px;right:18px;background:linear-gradient(135deg,#0e1a45,#1b3691);color:#fff;border:1px solid #1b3691;
padding:10px 16px;border-radius:9px;display:none;font-size:13px;z-index:9;box-shadow:0 6px 18px rgba(14,26,69,.4)}
#toast.err{background:#fff;color:#8a1c1c;border:1px solid #8a1c1c;border-left:4px solid #8a1c1c}
.money{text-align:right;font-variant-numeric:tabular-nums}
#pform{display:none;margin:12px 0 16px}
#pform.open{display:block}
#whform{display:none;margin-top:12px}
#whform.open{display:block}
.low{color:#8a1c1c;font-style:italic}.ok{color:var(--hi)}
#whoami{color:var(--mut);font-size:12px;margin-bottom:14px}
#whoami b{color:var(--hi)}
#logout{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:7px;
padding:5px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-left:8px}
#logout:hover{border-color:var(--hi);color:var(--hi)}
</style>
</head>
<body>
<nav id="nav">
 <div class="logo"><img src="/logo.png" alt="PT MTJ"><span><b>MTJ CHANNEL MANAGER</b><small>PT Monalisa Tunggal Jaya · est. 1980</small></span></div>
 <a data-v="dash" class="on">📊 Management Dashboard</a>
 <a data-v="stock">📦 Stock &amp; Inventory</a>
 <a data-v="transfer">🔁 Transfer Gudang</a>
 <a data-v="warehouses">🏬 Warehouses / Gudang</a>
 <a data-v="docs">🧾 Purchase &amp; Sales Docs</a>
 <a data-v="newdoc">➕ New Document</a>
 <a data-v="projects">🏗️ Projects</a>
 <a data-v="delivery">🚚 Delivery / Surat Jalan</a>
 <a data-v="warranty">🛡️ Warranty &amp; Service</a>
 <a data-v="profit">💰 Profitability</a>
 <a data-v="audit">🔐 Audit Trail</a>
 <a data-v="users" style="display:none">👥 Users &amp; Access</a>
</nav>
<main id="main"></main>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
