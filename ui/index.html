<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTJ Channel Manager</title>
<style>
:root{--bg:#0b0f17;--panel:#121826;--card:#171f30;--line:#232c40;--txt:#e8edf7;--mut:#8b96ad;
--acc:#2dd4bf;--acc2:#f59e0b;--red:#f87171;--grn:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,'Segoe UI',sans-serif;display:flex;min-height:100vh}
nav{width:210px;background:var(--panel);border-right:1px solid var(--line);padding:18px 0;flex-shrink:0}
.logo{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.logo b{color:var(--acc);font-size:15px}.logo small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
nav a{display:block;padding:9px 18px;color:var(--mut);text-decoration:none;font-size:13px;cursor:pointer}
nav a:hover{background:#1a2336;color:var(--txt)}nav a.on{color:var(--acc);border-right:3px solid var(--acc);background:#16202f}
main{flex:1;padding:22px 28px;max-width:1250px}
h1{font-size:20px;margin-bottom:4px}h2{font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .lbl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-size:21px;font-weight:700;margin-top:5px}.kpi .val.teal{color:var(--acc)}.kpi .val.amber{color:var(--acc2)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
th{background:#1a2336;text-align:left;padding:8px 10px;color:var(--mut);font-size:11px;text-transform:uppercase}
td{padding:8px 10px;border-top:1px solid var(--line)}
tr:hover td{background:#192136}
.btn{display:inline-block;background:var(--acc);color:#04211d;border:none;border-radius:7px;padding:7px 13px;font-weight:600;font-size:12px;cursor:pointer;margin:2px 4px 2px 0}
.btn.gray{background:#2a3550;color:var(--txt)}.btn.warn{background:var(--acc2);color:#241500}
.btn.sm{padding:4px 9px;font-size:11px}
input,select{background:#0e1523;border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:7px 9px;font-size:13px;width:100%}
form .row{display:flex;gap:10px;margin-bottom:10px}form label{display:block;color:var(--mut);font-size:11px;margin-bottom:3px}
.formbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:600}
.b-POSTED,.b-ACTIVE,.b-PAID,.b-RESERVED{background:#12351f;color:var(--grn)}
.b-DRAFT,.b-PLANNED{background:#252c3d;color:var(--mut)}
.b-SUBMITTED,.b-IN_PROGRESS,.b-REPAIRING{background:#33270c;color:var(--acc2)}
.b-APPROVED,.b-CONTRACTED,.b-COMPLETED{background:#0e2f38;color:#22d3ee}
.mut{color:var(--mut)}#toast{position:fixed;bottom:18px;right:18px;background:var(--card);border:1px solid var(--acc);
padding:10px 16px;border-radius:9px;display:none;font-size:13px;z-index:9}
.money{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<nav id="nav">
 <div class="logo"><b>MTJ CHANNEL MANAGER</b><small>PT Monalisa Tunggal Jaya · est. 1980</small></div>
 <a data-v="dash" class="on">📊 Management Dashboard</a>
 <a data-v="stock">📦 Stock &amp; Inventory</a>
 <a data-v="docs">🧾 Purchase &amp; Sales Docs</a>
 <a data-v="newdoc">➕ New Document</a>
 <a data-v="projects">🏗️ Projects</a>
 <a data-v="delivery">🚚 Delivery / Surat Jalan</a>
 <a data-v="warranty">🛡️ Warranty &amp; Service</a>
 <a data-v="profit">💰 Profitability</a>
 <a data-v="audit">🔐 Audit Trail</a>
</nav>
<main id="main"></main>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
